global
    log /dev/log local0
    daemon
    user haproxy
    group haproxy
    maxconn 20000

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend turidatunnel_tls_in
    bind :443
    default_backend turidatunnel_tls_backend

backend turidatunnel_tls_backend
    server nginx_tls 127.0.0.1:9443 check
