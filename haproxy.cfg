global
    log /dev/log local0
    daemon
    user haproxy
    group haproxy
    maxconn 20000

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h

# TLS passthrough. Replace ssh.DOMAIN with ssh.<your-domain>.
frontend turidatunnel_tls_in
    bind :443
    mode tcp
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    acl sni_ssh req.ssl_sni -i ssh.DOMAIN
    use_backend turidatunnel_ssh_tls if sni_ssh
    default_backend turidatunnel_xray_tls

backend turidatunnel_ssh_tls
    mode tcp
    server stunnel_ssh 127.0.0.1:8443 check

backend turidatunnel_xray_tls
    mode tcp
    server nginx_tls 127.0.0.1:9443 check
